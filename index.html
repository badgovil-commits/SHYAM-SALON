<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c5cff">
<title>Good Habits for Kids</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{background:linear-gradient(180deg,#b9efff,#fff7d8);color:#30364d}
.app{height:100%;display:flex;flex-direction:column}
header{text-align:center;padding:14px 12px 7px}
h1{margin:0;font-size:28px;font-weight:1000}
.sub{font-size:14px;font-weight:800;color:#687189;margin-top:3px}
#screen{position:relative;flex:1;overflow:hidden;touch-action:manipulation}
.card{position:absolute;inset:10px 12px 70px;background:#ffffffd9;border-radius:30px;box-shadow:0 12px 35px #30364d22;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px}
.emoji{font-size:110px;line-height:1;margin-bottom:12px}
.title{font-size:30px;font-weight:1000}
.instruction{font-size:20px;font-weight:900;margin-top:8px;text-align:center}
.play{margin-top:20px;border:0;border-radius:22px;padding:15px 28px;background:#fff;font-size:21px;font-weight:1000;box-shadow:0 7px 20px #30364d22}
.actionArea{display:flex;gap:16px;align-items:center;justify-content:center;margin-top:22px;min-height:105px}
.item{border:0;background:#fff;border-radius:24px;font-size:62px;padding:14px;box-shadow:0 6px 16px #30364d20;cursor:pointer}
.item.done{opacity:.25;transform:scale(.9)}
.message{min-height:34px;margin-top:15px;font-size:21px;font-weight:1000;text-align:center}
.next{position:absolute;bottom:15px;right:18px;border:0;background:#fff;border-radius:18px;padding:10px 16px;font-weight:1000;box-shadow:0 5px 16px #30364d20}
.back{position:absolute;bottom:15px;left:18px;border:0;background:#fff;border-radius:18px;padding:10px 16px;font-weight:1000;box-shadow:0 5px 16px #30364d20}
.celebrate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;pointer-events:none;font-size:46px;font-weight:1000;animation:celebrate 1.2s ease-out forwards}
@keyframes celebrate{0%{opacity:0;transform:scale(.5)}25%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1.25)}}
.confetti{position:absolute;font-size:25px;z-index:19;pointer-events:none;animation:fall 1.2s ease-out forwards}
@keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(240deg);opacity:0}}
</style>
</head>
<body>
<div class="app">
<header>
<h1>🌟 Good Habits!</h1>
<div class="sub">Learn by touching and playing</div>
</header>
<main id="screen"></main>
</div>
<script>
const habits=[
 {title:'Brush Teeth',emoji:'🪥',instruction:'Brush your teeth!',type:'brush'},
 {title:'Wash Hands',emoji:'🧼',instruction:'Wash your hands!',type:'wash'},
 {title:'Clean Toys',emoji:'🧸',instruction:'Put your toys away!',type:'toys'},
 {title:'Healthy Food',emoji:'🍎',instruction:'Choose healthy food!',type:'food'},
 {title:'Please & Thank You',emoji:'🙏',instruction:'Say please and thank you!',type:'words'},
 {title:'Be Gentle',emoji:'🐶',instruction:'Be gentle with animals!',type:'gentle'},
 {title:'Cut Nails',emoji:'✂️',instruction:"Let's keep our nails neat!",type:'nails'},
 {title:'Bedtime',emoji:'🛏️',instruction:"It's time for bed!",type:'bed'}
];
let index=0;
const screen=document.getElementById('screen');

function speak(text){
 try{
   if(!('speechSynthesis' in window))return;
   speechSynthesis.cancel();
   const u=new SpeechSynthesisUtterance(text);
   u.rate=.8;u.pitch=1.15;u.volume=1;
   speechSynthesis.speak(u);
 }catch(e){}
}
function celebrate(text='Great job!'){
 const e=document.createElement('div');e.className='celebrate';e.textContent='🎉 '+text+' ⭐';
 screen.appendChild(e);setTimeout(()=>e.remove(),1200);
 for(let i=0;i<14;i++){
   const c=document.createElement('div');c.className='confetti';
   c.textContent=['⭐','✨','🌈','💛'][Math.floor(Math.random()*4)];
   c.style.left='50%';c.style.top='45%';
   c.style.setProperty('--x',(Math.random()*260-130)+'px');
   c.style.setProperty('--y',(Math.random()*220-30)+'px');
   screen.appendChild(c);setTimeout(()=>c.remove(),1300);
 }
}
function render(){
 const h=habits[index];
 screen.innerHTML=`
 <section class="card">
   <div class="emoji">${h.emoji}</div>
   <div class="title">${h.title}</div>
   <div class="instruction">${h.instruction}</div>
   <div id="activity"></div>
   <div class="message" id="message">Tap to play! 👆</div>
 </section>
 <button class="back" id="back">◀ Back</button>
 <button class="next" id="next">Next ▶</button>`;
 document.getElementById('next').onclick=()=>{index=(index+1)%habits.length;render()};
 document.getElementById('back').onclick=()=>{index=(index-1+habits.length)%habits.length;render()};
 buildActivity(h);
}
function finish(message){
 document.getElementById('message').textContent=message;
 speak(message);
 setTimeout(()=>celebrate('Good job!'),350);
}
function buildActivity(h){
 const a=document.getElementById('activity');
 if(h.type==='brush'){
   a.innerHTML='<div class="actionArea"><button class="item" id="brush">🪥</button><button class="item">😁</button></div>';
   document.getElementById('brush').onclick=()=>{document.getElementById('brush').classList.add('done');finish('Clean teeth!')};
 } else if(h.type==='wash'){
   a.innerHTML='<div class="actionArea"><button class="item" id="soap">🧼</button><button class="item" id="water">💧</button><button class="item">🙌</button></div>';
   document.getElementById('soap').onclick=()=>document.getElementById('soap').classList.add('done');
   document.getElementById('water').onclick=()=>{document.getElementById('water').classList.add('done');finish('Clean hands!')};
 } else if(h.type==='toys'){
   a.innerHTML='<div class="actionArea"><button class="item toy">🧸</button><button class="item toy">🚗</button><button class="item toy">🧩</button><button class="item">🧺</button></div>';
   document.querySelectorAll('.toy').forEach(x=>x.onclick=()=>{x.classList.add('done');if([...document.querySelectorAll('.toy')].every(t=>t.classList.contains('done')))finish('Toys are tidy!')});
 } else if(h.type==='food'){
   a.innerHTML='<div class="actionArea"><button class="item food">🍎</button><button class="item food">🍌</button><button class="item food">🥕</button><button class="item">🍭</button></div>';
   document.querySelectorAll('.food').forEach(x=>x.onclick=()=>{x.classList.add('done');finish('Healthy choice!')});
 } else if(h.type==='words'){
   a.innerHTML='<div class="actionArea"><button class="item" id="please">🙏</button><button class="item" id="thanks">💛</button></div>';
   document.getElementById('please').onclick=()=>{speak('Please!');document.getElementById('message').textContent='Please! 😊'};
   document.getElementById('thanks').onclick=()=>{speak('Thank you!');finish('Thank you! 😊')};
 } else if(h.type==='gentle'){
   a.innerHTML='<div class="actionArea"><button class="item" id="pet">🐶</button><button class="item">❤️</button></div>';
   document.getElementById('pet').onclick=()=>{document.getElementById('pet').classList.add('done');finish('Gentle hands! ❤️')};
 } else if(h.type==='nails'){
   a.innerHTML='<div class="actionArea"><button class="item" id="clip">✂️</button><button class="item" id="hand">🖐️</button></div>';
   document.getElementById('clip').onclick=()=>{document.getElementById('clip').classList.add('done');document.getElementById('hand').textContent='🤚';finish('Nice clean nails!')};
 } else if(h.type==='bed'){
   a.innerHTML='<div class="actionArea"><button class="item" id="teddy">🧸</button><button class="item" id="sleep">😴</button></div>';
   document.getElementById('teddy').onclick=()=>document.getElementById('teddy').classList.add('done');
   document.getElementById('sleep').onclick=()=>{document.getElementById('sleep').classList.add('done');finish('Good night! 🌙')};
 }
}
render();
</script>
</body>
</html>
