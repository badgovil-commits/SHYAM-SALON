<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5d2fe0">
<title>Good Habits for Kids</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{background:linear-gradient(#9fe8ff,#fff1bb);color:#2e2450}
button{font:inherit}
.screen{height:100%;overflow:auto;padding:10px 10px 24px}
.header{max-width:980px;margin:auto;text-align:center;padding:4px 0 8px}
.header h1{margin:0;font-size:36px;font-weight:1000;letter-spacing:-1px}
.header p{margin:0;font-size:16px;font-weight:900;color:#63577a}
.grid{max-width:980px;margin:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.habitCard{border:0;padding:0;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 8px 20px #31265030;cursor:pointer}
.habitCard img{width:100%;display:block;aspect-ratio:240/345;object-fit:cover}
.cardTitle{padding:9px 9px;background:linear-gradient(90deg,#5a2bdc,#159fe6);color:white;font-size:15px;font-weight:1000;display:flex;justify-content:space-between;align-items:center}
.go{background:#fff;color:#2aa74c;border-radius:50%;padding:2px 7px}
#game{display:none;height:100%;padding:10px}
.topbar{max-width:980px;margin:auto;display:flex;justify-content:space-between;gap:8px}
.topbar button,.hear,.actionBtn{border:0;background:#fff;border-radius:18px;padding:10px 15px;font-weight:1000;box-shadow:0 6px 16px #31265025}
.lesson{max-width:980px;height:calc(100% - 50px);margin:8px auto 0;background:#fffdf8e8;border-radius:28px;overflow:hidden;box-shadow:0 12px 35px #31265030;display:flex;flex-direction:column}
.hero{height:50%;min-height:230px;background:#dff7ff;display:flex;justify-content:center;align-items:center;overflow:hidden;position:relative}
.hero img{width:100%;height:100%;object-fit:cover}
.instruction{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:#fffdf4f2;border-radius:20px;padding:9px 15px;box-shadow:0 5px 18px #31265025;text-align:center;font-size:18px;font-weight:1000;white-space:nowrap;max-width:94%}
.content{flex:1;overflow:auto;text-align:center;padding:10px 12px}
.content h2{margin:2px;font-size:28px}
.small{font-size:16px;font-weight:900;color:#6a607d}
.actions{min-height:115px;display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap}
.actionBtn{font-size:55px;padding:10px 18px;cursor:pointer}
.actionBtn:active{transform:scale(.9)}
.brush{animation:brush 1s ease-in-out infinite alternate}
.water{animation:water .7s linear infinite}
.pet{animation:pet 1s ease-in-out infinite alternate}
.sleep{animation:sleep 1.6s ease-in-out infinite}
@keyframes brush{to{transform:translateX(28px) rotate(8deg)}}
@keyframes water{50%{transform:translateY(10px)}}
@keyframes pet{to{transform:translateY(-4px) rotate(4deg)}}
@keyframes sleep{50%{transform:scale(1.1)}}
.message{min-height:32px;font-size:20px;font-weight:1000}
.progress{display:flex;justify-content:center;gap:8px;margin:6px}
.star{font-size:30px;opacity:.25} .star.on{opacity:1}
.reward{font-size:76px;animation:reward 1s ease-out}
@keyframes reward{0%{transform:scale(.2);opacity:0}55%{transform:scale(1.2);opacity:1}100%{transform:scale(1)}}
.conf{position:fixed;z-index:50;pointer-events:none;font-size:25px;animation:fall 1.2s forwards}
@keyframes fall{to{transform:translate(var(--x),var(--y)) rotate(360deg);opacity:0}}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.header h1{font-size:44px}}
</style>
</head>

let sound=true, current=0, points=0, completed=false;
const home=document.getElementById('home'), game=document.getElementById('game');
const hero=document.getElementById('heroImg'), bubble=document.getElementById('bubble');
const title=document.getElementById('lessonTitle'), actions=document.getElementById('actions');
const message=document.getElementById('message'), hear=document.getElementById('hear');

function slowSpeak(text){
  if(!sound || !('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.rate=0.62;
    u.pitch=1.12;
    u.volume=1;
    speechSynthesis.speak(u);
  }catch(e){}
}
function popSound(){
  if(!sound) return;
  try{
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    const c=new C(),o=c.createOscillator(),g=c.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(520,c.currentTime);
    o.frequency.exponentialRampToValueAtTime(110,c.currentTime+.18);
    g.gain.setValueAtTime(.0001,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.2,c.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.2);
    o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.22);
  }catch(e){}
}
function confetti(){
  for(let i=0;i<18;i++){
    const c=document.createElement('div');c.className='conf';
    c.textContent=['⭐','✨','🌈','💛','🎈'][Math.floor(Math.random()*5)];
    c.style.left='50%';c.style.top='45%';
    c.style.setProperty('--x',(Math.random()*320-160)+'px');
    c.style.setProperty('--y',(Math.random()*260-100)+'px');
    document.body.appendChild(c);setTimeout(()=>c.remove(),1300);
  }
}
function win(text){
  if(completed)return;
  completed=true;points++;popSound();message.textContent=text;slowSpeak(text);
  actions.innerHTML='<div class="reward">🎉⭐</div>';confetti();
  document.querySelectorAll('.star').forEach((s,i)=>s.classList.toggle('on',i<Math.min(points,5)));
}
function openHabit(i){
  current=i;completed=false;
  home.style.display='none';game.style.display='block';
  const h=habits[i];hero.src=imgs[i];hero.alt=h[0];
  title.textContent=h[0];bubble.textContent=h[2];message.textContent='';
  build(h);
}
function build(h){
  actions.innerHTML='';
  const t=h[0];
  if(t==='Brush Your Teeth'){
    actions.innerHTML='<button class="actionBtn brush">🪥</button><button class="actionBtn">😁</button>';
    actions.children[0].onclick=()=>win('Great job! Sparkling clean teeth!');
  } else if(t==='Wash Your Hands'){
    actions.innerHTML='<button class="actionBtn">🧼</button><button class="actionBtn water">💧</button><button class="actionBtn">🙌</button>';
    actions.children[0].onclick=()=>{message.textContent='Soap first!';slowSpeak('Use soap');};
    actions.children[1].onclick=()=>win('Clean hands! Great job!');
  } else if(t==='Clean Your Toys'){
    actions.innerHTML='<button class="actionBtn toy">🧸</button><button class="actionBtn toy">🚗</button><button class="actionBtn toy">🧩</button><button class="actionBtn">🧺</button>';
    document.querySelectorAll('.toy').forEach(x=>x.onclick=()=>{x.classList.add('done');if([...document.querySelectorAll('.toy')].every(y=>y.classList.contains('done')))win('All toys are tidy!')});
  } else if(t==='Eat Healthy Food'){
    actions.innerHTML='<button class="actionBtn good">🍎</button><button class="actionBtn good">🥕</button><button class="actionBtn good">🥦</button><button class="actionBtn">🍭</button>';
    document.querySelectorAll('.good').forEach(x=>x.onclick=()=>win('Healthy choice!'));
    actions.children[3].onclick=()=>{message.textContent='Try a healthy food!';slowSpeak('Try a healthy food');};
  } else if(t==='Please & Thank You'){
    actions.innerHTML='<button class="actionBtn">🙏</button><button class="actionBtn">💛</button>';
    actions.children[0].onclick=()=>{message.textContent='Please!';slowSpeak('Please');};
    actions.children[1].onclick=()=>win('Thank you! So kind!');
  } else if(t==='Be Gentle with Animals'){
    actions.innerHTML='<button class="actionBtn pet">🐶</button><button class="actionBtn">❤️</button>';
    actions.children[0].onclick=()=>win('Gentle hands! Wonderful!');
  } else if(t==='Cut Your Nails'){
    actions.innerHTML='<button class="actionBtn">🖐️</button><button class="actionBtn">✂️</button>';
    actions.children[1].onclick=()=>win('Nice clean nails!');
  } else {
    actions.innerHTML='<button class="actionBtn">🧸</button><button class="actionBtn sleep">😴</button>';
    actions.children[0].onclick=()=>{message.textContent='Teddy is ready for bed!';slowSpeak('Teddy is ready for bed');};
    actions.children[1].onclick=()=>win('Good night! Sleep well!');
  }
  // Do not auto-speak on page load: on iPhone, speech is much more reliable after a tap.
}
document.querySelectorAll('.habitCard').forEach(b=>b.onclick=()=>openHabit(+b.dataset.i));
hear.onclick=()=>slowSpeak(habits[current][2]);
document.getElementById('back').onclick=()=>{game.style.display='none';home.style.display='block';speechSynthesis&&speechSynthesis.cancel()};
</script>
